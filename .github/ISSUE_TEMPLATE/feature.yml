---

name: Feature request
description: Propose a focused improvement to gleam_mutants
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: >-
        Describe the user problem first. Dashboard, telemetry, and coverage
        integration are outside the 1.0 scope, as are monorepo orchestration
        and self-update.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe observable behaviour, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: >-
        Note effects on CLI, config, schemas, runtimes, or performance.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
