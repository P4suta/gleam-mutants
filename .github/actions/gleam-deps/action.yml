name: Gleam dependencies
description: >-
  Install the pinned toolchain and fetch every dependency the workspace and its
  fixtures lock, out of a cache wherever one is warm.

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
      with:
        install: true
        cache: true
    # Gleam keeps one package cache per user, outside the workspace, and the
    # manifests pin exactly what goes in it. A hit means `deps download` makes
    # no request to Hex at all, which is what keeps a shared runner address
    # running into Hex's rate limit from failing a run of ours.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/.cache/gleam
          ~/Library/Caches/gleam
          ~/AppData/Local/gleam
        key: >-
          gleam-hex-${{ runner.os }}-${{ hashFiles('manifest.toml',
          'fixtures/*/manifest.toml') }}
        restore-keys: |
          gleam-hex-${{ runner.os }}-
    # The unitest fixture is the one workspace whose dependencies the root
    # manifest does not already name, so its packages are fetched here rather
    # than by whichever smoke happens to snapshot it first.
    - run: node scripts/deps-download.mjs . fixtures/unitest_project
      shell: bash
