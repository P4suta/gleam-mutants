---
name: Publish verified release

"on":
  workflow_dispatch:
    inputs:
      source_sha:
        description: Source commit in the verified candidate
        required: true
        type: string
      version:
        description: Candidate version without the tag prefix
        required: true
        type: string
      candidate_run:
        description: Successful attested candidate run ID
        required: true
        type: string
      candidate_attempt:
        description: Exact successful candidate run attempt
        required: true
        type: string
      npm_auth:
        description: Explicit npm authentication method
        required: true
        default: trusted
        type: choice
        options: [trusted, bootstrap]

permissions: {}

concurrency:
  group: release-publication-${{ inputs.version }}
  cancel-in-progress: false

env:
  SOURCE: ${{ inputs.source_sha }}
  VERSION: ${{ inputs.version }}
  RUN: ${{ inputs.candidate_run }}
  ATTEMPT: ${{ inputs.candidate_attempt }}

jobs:
  preflight:
    name: Verify candidate and prepare publication plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact: ${{ steps.controller.outputs.artifact }}
    # Build the protected controller without publication authority.
    permissions:
      contents: read  # Read the controller and candidate source.
      actions: read  # Read the selected candidate run and artifacts.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.10.22
          install_args: rust cargo:cargo-audit
          cache: false
      - run: mise run release controller-check
      - id: controller
        run: mise run release controller-outputs
      - run: mise run check-release
      - run: mise run audit-tools
      - run: mise run prove-release
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          mise run release fetch build/candidate "$SOURCE" "$VERSION"
          "$RUN" "$ATTEMPT"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          mise run release plan build/candidate "$SOURCE" "$VERSION"
          "$RUN" "$ATTEMPT"
      - run: >-
          cargo build --locked --release --manifest-path tools/Cargo.toml
          --bin gleam-mutants-release --bin release-publish
          --target-dir build/release-controller
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.controller.outputs.artifact }}
          path: |
            build/release-controller/release/gleam-mutants-release
            build/release-controller/release/release-publish
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publication-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-plan.json
          if-no-files-found: error
          retention-days: 7

  attest-controller:
    name: Attest the protected controller
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact: >-
        verified-controller-${{ github.run_id }}-${{ github.run_attempt }}
    # Sign the controller without executing it or the candidate.
    permissions:
      contents: read  # Read repository identity.
      actions: read  # Download the checked controller.
      id-token: write  # Obtain the controller signing identity.
      attestations: write  # Retain controller provenance.
      artifact-metadata: write  # Bind controller metadata.
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ${{ needs.preflight.outputs.artifact }}
          path: controller
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: controller/*
      - env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" controller/controller.sigstore.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: >-
            verified-controller-${{ github.run_id }}-${{ github.run_attempt }}
          path: controller/
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Prepare immutable tag and complete draft
    needs: [preflight, attest-controller]
    environment: release-github
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Keep this phase's authority separate from builds and other registries.
    permissions:
      contents: write  # Maintain the approved GitHub release.
      actions: read  # Download the exact candidate and controller.
    env:
      RELEASE_ENVIRONMENT: release-github
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ${{ needs.attest-controller.outputs.artifact }}
          path: controller
      - name: Verify the protected controller before execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify controller/gleam-mutants-release
          --repo P4suta/gleam-mutants --deny-self-hosted-runners
          --signer-workflow
          P4suta/gleam-mutants/.github/workflows/release-publish.yml
          --source-ref refs/heads/main --source-digest "$GITHUB_SHA"
          --signer-digest "$GITHUB_SHA"
      - name: Verify the publication adapter before execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify controller/release-publish
          --repo P4suta/gleam-mutants --deny-self-hosted-runners
          --signer-workflow
          P4suta/gleam-mutants/.github/workflows/release-publish.yml
          --source-ref refs/heads/main --source-digest "$GITHUB_SHA"
          --signer-digest "$GITHUB_SHA"
      - run: >-
          chmod u+x controller/gleam-mutants-release
          controller/release-publish
      - name: Verify the original candidate again
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./controller/gleam-mutants-release fetch build/candidate
          "$SOURCE" "$VERSION" "$RUN" "$ATTEMPT"
      - name: Execute the approved draft phase
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./controller/release-publish execute draft build/candidate
          "$SOURCE" "$VERSION" "$RUN" "$ATTEMPT"

  registry-ready:
    name: Verify registry prerequisites without publication
    needs: [draft, attest-controller]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read  # Read source identity without draft authority.
      actions: read  # Verify the completed draft producer.
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ${{ needs.attest-controller.outputs.artifact }}
          path: controller
      - name: Verify the protected controller before execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify controller/gleam-mutants-release
          --repo P4suta/gleam-mutants --deny-self-hosted-runners
          --signer-workflow
          P4suta/gleam-mutants/.github/workflows/release-publish.yml
          --source-ref refs/heads/main --source-digest "$GITHUB_SHA"
          --signer-digest "$GITHUB_SHA"
      - name: Verify the publication adapter before execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify controller/release-publish
          --repo P4suta/gleam-mutants --deny-self-hosted-runners
          --signer-workflow
          P4suta/gleam-mutants/.github/workflows/release-publish.yml
          --source-ref refs/heads/main --source-digest "$GITHUB_SHA"
          --signer-digest "$GITHUB_SHA"
      - run: >-
          chmod u+x controller/gleam-mutants-release
          controller/release-publish
      - name: Verify the original candidate again
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./controller/gleam-mutants-release fetch build/candidate
          "$SOURCE" "$VERSION" "$RUN" "$ATTEMPT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - name: Check Hex prerequisites with read-only GitHub authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./controller/release-publish check-registry hex build/candidate
          "$SOURCE" "$VERSION" "$RUN" "$ATTEMPT"
      - name: Check npm prerequisites with read-only GitHub authority
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_PUBLISH_AUTH: ${{ inputs.npm_auth }}
        run: >-
          ./controller/release-publish check-registry npm build/candidate
          "$SOURCE" "$VERSION" "$RUN" "$ATTEMPT"

  hex:
    name: Publish verified Hex archive
    needs: [registry-ready, attest-controller]
    environment: release-hex
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Keep this phase's authority separate from builds and other registries.
    permissions:
      contents: read  # Read candidate and controller identities.
      actions: read  # Download the exact candidate and controller.
    env:
      RELEASE_ENVIRONMENT: release-hex
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ${{ needs.attest-controller.outputs.artifact }}
          path: controller
      - name: Verify the protected controller before execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify controller/gleam-mutants-release
          --repo P4suta/gleam-mutants --deny-self-hosted-runners
          --signer-workflow
          P4suta/gleam-mutants/.github/workflows/release-publish.yml
          --source-ref refs/heads/main --source-digest "$GITHUB_SHA"
          --signer-digest "$GITHUB_SHA"
      - name: Verify the publication adapter before execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify controller/release-publish
          --repo P4suta/gleam-mutants --deny-self-hosted-runners
          --signer-workflow
          P4suta/gleam-mutants/.github/workflows/release-publish.yml
          --source-ref refs/heads/main --source-digest "$GITHUB_SHA"
          --signer-digest "$GITHUB_SHA"
      - run: >-
          chmod u+x controller/gleam-mutants-release
          controller/release-publish
      - name: Verify the original candidate again
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./controller/gleam-mutants-release fetch build/candidate
          "$SOURCE" "$VERSION" "$RUN" "$ATTEMPT"
      - name: Execute the approved hex phase
        env:
          GH_TOKEN: ${{ github.token }}
          HEXPM_API_KEY: ${{ secrets.HEXPM_API_KEY }}
        run: >-
          ./controller/release-publish execute hex build/candidate
          "$SOURCE" "$VERSION" "$RUN" "$ATTEMPT"

  npm:
    name: Publish verified npm archive
    needs: [registry-ready, attest-controller]
    environment: release-npm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Keep this phase's authority separate from builds and other registries.
    permissions:
      contents: read  # Read candidate and controller identities.
      actions: read  # Download the exact candidate and controller.
      id-token: write  # Authenticate npm trusted publication.
    env:
      RELEASE_ENVIRONMENT: release-npm
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ${{ needs.attest-controller.outputs.artifact }}
          path: controller
      - name: Verify the protected controller before execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify controller/gleam-mutants-release
          --repo P4suta/gleam-mutants --deny-self-hosted-runners
          --signer-workflow
          P4suta/gleam-mutants/.github/workflows/release-publish.yml
          --source-ref refs/heads/main --source-digest "$GITHUB_SHA"
          --signer-digest "$GITHUB_SHA"
      - name: Verify the publication adapter before execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify controller/release-publish
          --repo P4suta/gleam-mutants --deny-self-hosted-runners
          --signer-workflow
          P4suta/gleam-mutants/.github/workflows/release-publish.yml
          --source-ref refs/heads/main --source-digest "$GITHUB_SHA"
          --signer-digest "$GITHUB_SHA"
      - run: >-
          chmod u+x controller/gleam-mutants-release
          controller/release-publish
      - name: Verify the original candidate again
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./controller/gleam-mutants-release fetch build/candidate
          "$SOURCE" "$VERSION" "$RUN" "$ATTEMPT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - name: Execute the approved npm phase
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_PUBLISH_AUTH: ${{ inputs.npm_auth }}
          NPM_BOOTSTRAP_TOKEN: >-
            ${{ inputs.npm_auth == 'bootstrap' &&
            secrets.NPM_BOOTSTRAP_TOKEN || '' }}
        run: >-
          ./controller/release-publish execute npm build/candidate
          "$SOURCE" "$VERSION" "$RUN" "$ATTEMPT"

  finalize:
    name: Publish complete verified GitHub release
    needs: [draft, hex, npm, attest-controller]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Keep this phase's authority separate from builds and other registries.
    permissions:
      contents: write  # Maintain the approved GitHub release.
      actions: read  # Download the exact candidate and controller.
    env:
      RELEASE_ENVIRONMENT: release
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ${{ needs.attest-controller.outputs.artifact }}
          path: controller
      - name: Verify the protected controller before execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify controller/gleam-mutants-release
          --repo P4suta/gleam-mutants --deny-self-hosted-runners
          --signer-workflow
          P4suta/gleam-mutants/.github/workflows/release-publish.yml
          --source-ref refs/heads/main --source-digest "$GITHUB_SHA"
          --signer-digest "$GITHUB_SHA"
      - name: Verify the publication adapter before execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify controller/release-publish
          --repo P4suta/gleam-mutants --deny-self-hosted-runners
          --signer-workflow
          P4suta/gleam-mutants/.github/workflows/release-publish.yml
          --source-ref refs/heads/main --source-digest "$GITHUB_SHA"
          --signer-digest "$GITHUB_SHA"
      - run: >-
          chmod u+x controller/gleam-mutants-release
          controller/release-publish
      - name: Verify the original candidate again
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./controller/gleam-mutants-release fetch build/candidate
          "$SOURCE" "$VERSION" "$RUN" "$ATTEMPT"
      - name: Execute the approved finalize phase
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./controller/release-publish execute finalize build/candidate
          "$SOURCE" "$VERSION" "$RUN" "$ATTEMPT"
