name: Release PR

"on":
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pr:
    name: Prepare version proposal
    environment: release-prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Prepare the proposal and request its read-only CI check.
    permissions:
      contents: write  # Maintain the version proposal branch.
      issues: write  # Maintain release-please tracking.
      pull-requests: write  # Maintain the version proposal.
      actions: write  # Dispatch CI for the bot-authored proposal.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.10.22
          install_args: rust rumdl
          cache: false
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          token: ${{ github.token }}
          skip-github-release: true
      - name: Ensure the proposal has CI for its current head
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run release proposal-checks
