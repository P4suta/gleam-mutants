---
name: Verify registry credential transport

"on":
  workflow_dispatch:
    inputs:
      registry:
        description: Existing key to verify without publishing
        type: choice
        required: true
        options: [hex, npm]
      expected_username:
        description: Exact account username expected from the registry
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: credential-verification-${{ inputs.registry }}
  cancel-in-progress: false

jobs:
  hex:
    name: Verify Hex credential metadata
    if: inputs.registry == 'hex'
    environment: release-hex
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.10.22
          install_args: rust
          cache: false
      - run: >-
          cargo build --locked --manifest-path tools/Cargo.toml
          --target-dir build/credential-check --bin release-credentials
      - name: Read Hex authentication metadata only
        env:
          RELEASE_ENVIRONMENT: release-hex
          EXPECTED_USERNAME: ${{ inputs.expected_username }}
          HEXPM_API_KEY: ${{ secrets.HEXPM_API_KEY }}
        run: >-
          ./build/credential-check/debug/release-credentials
          hex "$EXPECTED_USERNAME"

  npm:
    name: Verify npm bootstrap credential metadata
    if: inputs.registry == 'npm'
    environment: release-npm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.10.22
          install_args: rust
          cache: false
      - run: >-
          cargo build --locked --manifest-path tools/Cargo.toml
          --target-dir build/credential-check --bin release-credentials
      - name: Read npm bootstrap authentication metadata only
        env:
          RELEASE_ENVIRONMENT: release-npm
          EXPECTED_USERNAME: ${{ inputs.expected_username }}
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: >-
          ./build/credential-check/debug/release-credentials
          npm "$EXPECTED_USERNAME"
