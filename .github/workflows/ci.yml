# SPDX-License-Identifier: MIT OR Apache-2.0

name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install: true
          cache: true
      - run: gleam deps download
      - run: npm ci --ignore-scripts
      - run: mise run check

  platform-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install: true
          cache: true
      - run: gleam deps download
      - run: npm ci --ignore-scripts
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium firefox webkit
      - if: runner.os != 'Linux'
        run: npx playwright install chromium firefox webkit
      - run: mise run test-integration

  runtime-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install: true
          cache: true
      - run: gleam deps download
      - run: mise run test-matrix

  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install: true
          cache: true
      - run: gleam deps download
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: mise run package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gleam-mutants-0.1.0-development-snapshot
          path: dist/
          if-no-files-found: error
          retention-days: 14

  dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          install: true
          cache: true
      - run: gleam deps download
      - run: mise run dogfood
