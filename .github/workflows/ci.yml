# SPDX-License-Identifier: MIT OR Apache-2.0

name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          install: true
          cache: true
      - run: gleam deps download
      - run: npm ci --ignore-scripts
      - run: mise run check

  platform-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          install: true
          cache: true
      - run: gleam deps download
      - run: npm ci --ignore-scripts
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium firefox webkit
      - if: runner.os != 'Linux'
        run: npx playwright install chromium firefox webkit
      - run: mise run test-integration

  runtime-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          install: true
          cache: true
      - run: gleam deps download
      - run: mise run test-matrix

  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          install: true
          cache: true
      - run: gleam deps download
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: mise run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gleam-mutants-1.0.0-unpublished
          path: dist/
          if-no-files-found: error
          retention-days: 14

  dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          install: true
          cache: true
      - run: gleam deps download
      - run: mise run dogfood
