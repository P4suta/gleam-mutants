name: CI

"on":
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.10.22
          cache: true
      - run: node scripts/deps-download.mjs . fixtures/unitest_project
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: mise run check
      - run: mise run audit-tools
      - run: mise run test-integration

  required:
    name: required
    if: always()
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require a successful executed fast gate
        env:
          RESULT: ${{ needs.quality.result }}
        run: test "$RESULT" = success
