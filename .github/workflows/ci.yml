name: CI

"on":
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional exact commit expected by the dispatcher
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify the requested source before execution
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.source_sha != ''
        env:
          EXPECTED_SOURCE: ${{ inputs.source_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SOURCE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: P4suta/gleam-mutants/.github/actions/gleam-deps@a9d791ae40e6c8adaf154f6375d197e6ca521a93
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: mise run check
      - run: mise run audit-tools
      - run: mise run test-integration

  required:
    name: required
    if: always()
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require a successful executed fast gate
        env:
          RESULT: ${{ needs.quality.result }}
        run: test "$RESULT" = success
