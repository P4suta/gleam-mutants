---

version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/gleam-deps
    schedule:
      interval: weekly
      day: monday
      time: "03:17"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:37"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      development-dependencies:
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
      day: monday
      time: "03:47"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    # Neither of these is a dependency with a version of its own to follow.
    # `@types/vscode` restates `engines.vscode`, which says which editors the
    # extension supports, and raising it alone would let the extension call
    # API that the editors it claims to support do not have. `@types/node`
    # restates the Node in `mise.toml`, for the same reason. Both move when
    # the thing they describe moves, which is a decision rather than an
    # update.
    ignore:
      - dependency-name: "@types/vscode"
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      development-dependencies:
        dependency-type: development
        patterns:
          - "*"
