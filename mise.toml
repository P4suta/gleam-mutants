[tools]
gleam = "1.18.1"
erlang = "29.0.5"
node = "24.19.0"
deno = "2.9.5"
bun = "1.3.14"
rust = { version = "1.99.1", components = "clippy,rustfmt" }
"cargo:cargo-audit" = "0.22.2"
syft = "1.51.0"
grype = "0.116.1"
uv = "0.12.0"
lefthook = "2.1.9"
committed = "1.1.11"
typos = "1.48.0"
taplo = "0.10.0"
actionlint = "1.7.12"
gitleaks = "8.30.1"
yamllint = "1.38.0"
rumdl = "0.2.43"

[tasks.bootstrap]
description = "Install pinned tools, fetch dependencies, and install hooks"
run = [
  "mise install",
  "node scripts/deps-download.mjs . fixtures/unitest_project",
  "lefthook install",
]

[tasks.build]
description = "Build both supported Gleam targets with warnings denied"
run = [
  "gleam build --target erlang --warnings-as-errors",
  "gleam build --target javascript --warnings-as-errors",
]

[tasks.test]
description = "Run unit tests on Erlang and Node"
run = [
  "gleam test --target erlang",
  "gleam test --target javascript --runtime node",
]

[tasks.test-integration]
description = "Run snapshot mutation-engine smoke tests"
run = [
  "gleam run -m api_smoke --target erlang",
  "gleam run -m api_smoke --target javascript --runtime node",
  "gleam run -m local_dependency_smoke --target erlang",
  "gleam run -m local_dependency_smoke --target javascript --runtime node",
  "gleam run -m process_output_smoke --target erlang",
  "gleam run -m process_output_smoke --target javascript --runtime node",
  "gleam run -m process_output_smoke --target javascript --runtime deno",
  "gleam run -m process_output_smoke --target javascript --runtime bun",
  "gleam run -m engine_smoke --target erlang",
  "gleam run -m engine_smoke --target javascript --runtime node",
  "gleam run -m adaptive_engine_smoke --target erlang",
  "gleam run -m discharge_smoke --target erlang",
  "gleam run -m compiler_validation_smoke --target erlang",
  "node scripts/snapshot-safety-smoke.mjs",
  "node scripts/report-storage-smoke.mjs",
  "node scripts/report-lifecycle-smoke.mjs",
  "node scripts/workspace-lock-smoke.mjs",
  "node scripts/check-schema.mjs",
  "npx playwright test",
  "node scripts/process-tree-smoke.mjs",
  "node scripts/interrupt-exit-smoke.mjs",
  "node scripts/interrupt-tree-smoke.mjs",
]

[tasks.test-matrix]
description = "Run unit and end-to-end tests on Erlang, Node, Deno, and Bun"
run = [
  "gleam test --target erlang",
  "gleam test --target javascript --runtime node",
  "deno run --allow-read --allow-write --allow-run --allow-env=GLEAM_MUTANTS_ACTIVE,GLEAM_MUTANTS_RUNTIME,GLEAM_MUTANTS_TEST_IMPACT_FILE,GLEAM_MUTANTS_TEST_SELECTION_FILE,TMPDIR,TEMP,TMP,HOME,USERPROFILE,XDG_CACHE_HOME,LOCALAPPDATA,GITHUB_ACTIONS,GITHUB_STEP_SUMMARY build/dev/javascript/gleam_mutants/gleam@@private_main_v1.18.1.mjs",
  "gleam test --target javascript --runtime bun",
  "gleam run -m engine_matrix_smoke --target erlang",
  "gleam run -m framework_matrix_smoke --target erlang",
  "node scripts/report-runtime-smoke.mjs",
]

[tasks.fmt]
description = "Check all Gleam source formatting"
run = "gleam format --check src test fixtures"

[tasks.docs]
description = "Build package documentation and validate Markdown"
run = ["gleam docs build", "rumdl check ."]

[tasks.lint]
description = "Run repository, licence, metadata, and security linters"
run = [
  "typos",
  "taplo check gleam.toml mise.toml manifest.toml fixtures/*/manifest.toml REUSE.toml .typos.toml",
  "actionlint",
  "yamllint .github lefthook.yml",
  "gitleaks dir . --no-banner --redact --verbose",
  "uvx --from \"reuse[charset-normalizer]==6.2.0\" reuse lint",
  "node scripts/check-vendor.mjs",
  "node scripts/check-version.mjs",
  "node scripts/check-package-information.mjs",
  "node scripts/check-errors.mjs",
  "node scripts/check-schema.mjs",
]

[tasks.check]
description = "Run all local release-readiness checks"
run = [
  "mise run check-verification",
  "mise run check-release",
  "mise run fmt",
  "mise run build",
  "mise run test",
  "mise run docs",
  "mise run lint",
]

[tasks.check-verification]
description = "Check source derivation, compiler failures, and process supervision"
run = [
  "cargo fmt --manifest-path verification/Cargo.toml --check",
  "cargo clippy --locked --manifest-path verification/Cargo.toml --target-dir build/verification-rust --all-targets -- -D warnings",
  "cargo test --locked --manifest-path verification/Cargo.toml --target-dir build/verification-rust",
]

[tasks.prove]
description = "Prove source-derived predicates and reject each broken contract in bounded containers"
run = "cargo run --locked --manifest-path verification/Cargo.toml --target-dir build/verification-rust -- prove"

[tasks.check-release]
description = "Check release identities, candidate evidence, and denied publication paths"
run = [
  "cargo fmt --all --manifest-path tools/Cargo.toml --check",
  "cargo clippy --locked --workspace --manifest-path tools/Cargo.toml --target-dir build/release-rust --all-targets -- -D warnings",
  "cargo test --locked --workspace --manifest-path tools/Cargo.toml --target-dir build/release-rust",
]

[tasks.release]
description = "Inspect or prepare a candidate without signing, tagging, or publishing"
run = "cargo run --locked --manifest-path tools/release/Cargo.toml --target-dir build/release-runner --"

[tasks.prove-release]
description = "Prove release decisions in bounded Kani containers and reject broken controls"
run = "mise run release prove"

[tasks.scan-sboms]
description = "Assess every distribution SBOM for known High/Critical vulnerabilities"
run = "node scripts/scan-sboms.mjs"

[tasks.audit-tools]
description = "Audit locked release dependencies against the pinned RustSec revision"
run = "mise run release audit-tools"

[tasks.test-minimum]
description = "Check the declared minimum Gleam and Node versions and the current compiler on Node 20"
run = [
  "mise install gleam@1.17.0 node@20.0.0",
  "mise x gleam@1.17.0 node@20.0.0 -- gleam test --target erlang",
  "mise x gleam@1.17.0 node@20.0.0 -- gleam test --target javascript --runtime node",
  "mise x node@20.0.0 -- gleam test --target javascript --runtime node",
  "mise x node@20.0.0 -- gleam run -m gleam_mutants --target javascript --runtime node -- --version",
]

[tasks.dogfood]
description = "Require all 50 score mutants to fail the full unit suite without cached or inconclusive outcomes"
timeout = "15m"
run = "gleam run -m dogfood_smoke --target erlang"

[tasks.package]
description = "Build and smoke-test development snapshot Hex, escript, and npm artifacts"
run = "node scripts/verify-package.mjs"

[tasks.test-property]
description = "Run 10,000 deterministic UTF-8 span, path, glob, and decoder properties"
run = "gleam run -m property_smoke --target erlang -- 10000 24301"

[tasks.test-faults]
description = "Run storage recovery, lifecycle, cache, and lock fault-oriented smokes"
run = [
  "node scripts/report-storage-smoke.mjs",
  "node scripts/report-lifecycle-smoke.mjs",
  "node scripts/workspace-lock-smoke.mjs",
]

[tasks.benchmark]
description = "Run the 1,000-file, 100MiB, at-least-10,000-mutant tested-envelope benchmark"
run = "node scripts/benchmark.mjs"

[tasks.test-ecosystem]
description = "Mutation-test five fixed official Gleam corpora with a 13-minute deadline"
run = "node scripts/ecosystem-smoke.mjs"

[tasks.release-candidate]
description = "Verify already-built development snapshot artifacts without publishing"
run = [
  "mise run prove",
  "mise run prove-release",
  "mise run release check-dist dist",
  "mise run scan-sboms",
]

[tasks.hooks]
description = "Install git hooks"
run = "lefthook install"
